<!doctype html>
<html lang="en" data-theme="dispatcher" data-appearance="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var a = localStorage.getItem('onfly-appearance')
        if (a === 'light' || a === 'dark') {
          document.documentElement.setAttribute('data-appearance', a)
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/portal.webmanifest" />
    <meta name="theme-color" content="#0C0C0E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OnFly" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>OnFly OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
